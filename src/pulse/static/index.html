<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header class="page-head">
      <div>
        <h1 class="page-title">Pulse</h1>
        <div class="page-subtitle">Service health monitor</div>
      </div>
      <div class="page-subtitle" id="last-updated">—</div>
    </header>

    <section class="stat-bar" id="stats" aria-label="Overview"></section>
    <section class="service-list" id="services" aria-label="Services"></section>

    <section class="alerts-panel" aria-label="Recent alerts">
      <h2>Recent alerts</h2>
      <div id="alerts"></div>
    </section>

    <footer class="page-foot">Pulse &middot; auto-refresh every 5 s</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>

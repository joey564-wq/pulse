# services.toml — the list of things pulse watches

[[services]]
name = "example"
url = "https://example.com"
interval_seconds = 30
timeout_seconds = 5
alert_after_failures = 3

[[services]]
name = "google"
url = "https://www.google.com"
interval_seconds = 60
timeout_seconds = 5
alert_after_failures = 3

[[services]]
name = "broken"
url = "http://localhost:9999"
interval_seconds = 15
timeout_seconds = 2
alert_after_failures = 2